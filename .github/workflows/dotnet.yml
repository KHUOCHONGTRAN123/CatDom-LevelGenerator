name: .NET checks
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Solver.slnx
      - name: Build
        id: build
        run: dotnet build Solver.slnx -c Release --no-restore -m:1 /p:BuildInParallel=false /p:UseSharedCompilation=false
      - name: Generator test harness
        run: dotnet run --project LevelGenerator.Tests -c Release --no-build --no-restore
      - name: Independent countdown oracle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet Verification/bin/Release/net10.0/Solver.Verification.dll v3-countdown-oracle-tests .
